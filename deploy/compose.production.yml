# Article Studio on the Designally NAS — the Portainer stack.
#
# Nothing in this file is a secret, and nothing secret may be added to it.
# Every ${NAME} is a Portainer stack environment variable, entered there by Ake;
# docs/deploy-nas.md says what each one is. `:?` means the stack refuses to
# start without it, rather than starting a container that fails later.
#
# IMAGE_TAG is `sha-<full 40-character commit>`, copied from the release
# workflow's run summary. There is no default and never `latest`.
#
# THE IMAGE NAME CHANGED WITH THE REPOSITORY, on 16 September 2026. Anything
# published before then is under `ghcr.io/designally-co/content-studio`,
# including the image production is running today, and that package is kept so
# a rollback to it stays possible. To roll back that far, change this line as
# well as IMAGE_TAG.
services:
  app:
    image: ghcr.io/designally-co/article-studio:${IMAGE_TAG:?set IMAGE_TAG to sha-<full commit>}
    container_name: article-studio
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # The public origin, for sign-in. Behind Caddy the standalone server
      # reports itself as 0.0.0.0:3000, and Google would be sent back there.
      # Not a secret.
      AUTH_URL: https://article-studio.designally.co
      # Migrations are a separate, approved one-off step — never a side effect
      # of a container starting.
      SKIP_DB_MIGRATE: "1"

      DATABASE_URL: ${DATABASE_URL:?}

      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?}

      # The exact value from the current deployment. A new one cannot decrypt
      # the provider keys already saved.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      FAL_KEY: ${FAL_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}

      CRON_SECRET: ${CRON_SECRET:?}

      HUB_BASE_URL: ${HUB_BASE_URL:?}
      HUB_API_KEY: ${HUB_API_KEY:?}

      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:?}
    # No published ports: Caddy reaches article-studio:3000 on caddy_default.
    networks:
      - caddy_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  caddy_default:
    external: true
